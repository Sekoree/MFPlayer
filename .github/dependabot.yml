# F-17 (2026-08-14 review): automated dependency + action-pin updates. Vulnerable or stale
# dependencies arrive as reviewable PRs instead of being discovered by hand-run audits.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Repo-built binding served from the local ./packages feed (see nuget.config) - there is no
      # public 9.x for Dependabot to bump to, and a downgrade PR to public 8.1 would break the ABI.
      - dependency-name: "FFmpeg.AutoGen"
      # SkiaSharp follows Avalonia (owner decision closing review F-24): Avalonia's Skia backend
      # depends on SkiaSharp 3.x, so a standalone major bump would fight the UI framework. Move it
      # only alongside an Avalonia release that moves itself.
      - dependency-name: "SkiaSharp*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
